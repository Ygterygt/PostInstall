name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static analysis (PSScriptAnalyzer)
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap | Out-String -Width 250 | Write-Host
          $errors = @($results | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) { throw "$($errors.Count) PSScriptAnalyzer error(s)" }

      - name: Build launcher (csc)
        shell: powershell
        run: .\Tools\Build-Launcher.ps1 -OutputPath "$env:RUNNER_TEMP\PostInstall.exe"

      - name: Test battery (Windows PowerShell 5.1)
        shell: powershell
        run: |
          .\Test-PostInstallSuite.ps1 -OutputPath "$env:RUNNER_TEMP\TestResults.json"
          if ($LASTEXITCODE -ne 0) { throw "$LASTEXITCODE test(s) failed" }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults.json
